apiVersion: apps/v1
kind: Deployment
metadata:
  name: razorpay-backend
  namespace: default
  labels:
    app: razorpay-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: razorpay-backend
  template:
    metadata:
      labels:
        app: razorpay-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/santusht06/razorpay-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017"
            - name: MONGODB_DB_NAME
              value: "razorpay_recovery_db"
            - name: REDIS_URL
              value: "redis://redis:6379"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: razorpay-backend-service
  namespace: default
spec:
  selector:
    app: razorpay-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
